# Validação de pushes e PRs. Não acessa a AWS: o repositório é público, e um `tofu plan`
# aqui leria os segredos do state. O deploy fica em deploy.yml, só para tags.
name: CI

on:
  push:
    branches: [develop, main, 'feature/**', 'release/**', 'hotfix/**']
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (typecheck, testes, bundle)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Os testes de integração criam um banco temporário por suíte neste servidor.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w api
      - run: npm test -w api
      - run: npm run build:lambda -w api

  web:
    name: Sites (typecheck, generate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck:web
      - run: npm run build:web

  infra:
    name: OpenTofu (fmt, validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.13.2
      - run: tofu fmt -check -recursive infra
      - run: tofu -chdir=infra init -backend=false -input=false
      - run: tofu -chdir=infra validate
      - run: tofu -chdir=infra/bootstrap init -backend=false -input=false
      - run: tofu -chdir=infra/bootstrap validate
