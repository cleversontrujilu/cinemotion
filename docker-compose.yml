# PostgreSQL 18 local (uuidv7() é nativo só a partir da 18).
# Porta configurável para não colidir com um Postgres já instalado: POSTGRES_PORT=5433 docker compose up -d
services:
  postgres:
    image: postgres:18
    container_name: cinemotion-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cinemotion
      TZ: America/Sao_Paulo
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cinemotion"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
